plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luis.pajaritoc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luis.chessdel'
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '3'
    }

    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            } else {
                // Sin clave guardada: usa la clave de prueba
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
